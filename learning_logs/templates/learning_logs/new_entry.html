{% extends 'learning_logs/base.html' %}
{% load bootstrap4 %}

{% block page_header %}
	<h2>Add a new entry</h2>
{% endblock page_header %}

{% block content %}

<p><a href="{% url 'learning_logs:topic' topic.id %}"> {{ topic }}</a></p>

<p>Add a new entry:</p>
<form method="post" action="{% url 'learning_logs:new_entry' topic.id %}" class="form">
	{% csrf_token %}
	{% bootstrap_form form %}
	{% buttons %}
		<button name='submit' class="btn btn-primary">New entry</button>
	{% endbuttons %}
</form>

{% endblock content %}
